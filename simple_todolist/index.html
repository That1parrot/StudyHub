<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunEditor with Custom Background</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/suneditor/dist/css/suneditor.min.css">
    <script src="https://cdn.jsdelivr.net/npm/suneditor/dist/suneditor.min.js"></script>
    
    <style>
        /* Default Background */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #f8f9fa, #e9ecef);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Editor Container */
        .editor-container {
            width: 80%;
            max-width: 900px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: left;
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #333;
        }

        /* Gradient Controls */
        .background-controls {
            margin-top: 20px;
            text-align: center;
        }

        .background-controls label {
            font-weight: bold;
            margin-right: 5px;
        }

        /* Preset Library */
        .preset-library {
            margin-top: 20px;
            text-align: center;
        }

        .preset-item {
            display: inline-block;
            width: 150px;
            height: 50px;
            margin: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
            border-radius: 5px;
            position: relative;
        }

        .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: red;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="editor-container">
        <h2>Text Editor</h2>
        <textarea id="editor"></textarea>
    </div>

    <div class="background-controls">
        <label for="color1">Color 1:</label>
        <input type="color" id="color1" value="#f8f9fa">
        <label for="color2">Color 2:</label>
        <input type="color" id="color2" value="#e9ecef">
        <button onclick="applyGradient()">Apply Background</button>
        <button onclick="savePreset()">Save Preset</button>
    </div>

    <div class="preset-library">
        <h3>Preset Library</h3>
        <div id="presetContainer"></div>
    </div>

    <script>
        const editor = SUNEDITOR.create("editor", {
            width: "100%",
            height: "500px",
            buttonList: [
                ['undo', 'redo'],
                ['bold', 'italic', 'underline', 'strike'],
                ['list', 'align', 'fontSize', 'fontColor', 'hiliteColor'],
                ['table', 'link', 'image'],
                ['removeFormat']
            ]
        });

        function applyGradient() {
            var color1 = document.getElementById('color1').value;
            var color2 = document.getElementById('color2').value;
            document.body.style.background = `linear-gradient(to bottom, ${color1}, ${color2})`;
        }

        function savePreset() {
            var color1 = document.getElementById('color1').value;
            var color2 = document.getElementById('color2').value;
            let presets = JSON.parse(localStorage.getItem('bgPresets')) || [];
            presets.push({ color1, color2 });
            localStorage.setItem('bgPresets', JSON.stringify(presets));
            loadPresetLibrary();
        }

        function deletePreset(index) {
            let presets = JSON.parse(localStorage.getItem('bgPresets')) || [];
            presets.splice(index, 1);
            localStorage.setItem('bgPresets', JSON.stringify(presets));
            loadPresetLibrary();
        }

        function loadPresetLibrary() {
            let presets = JSON.parse(localStorage.getItem('bgPresets')) || [];
            let presetContainer = document.getElementById('presetContainer');
            presetContainer.innerHTML = '';

            presets.forEach((preset, index) => {
                let div = document.createElement('div');
                div.className = 'preset-item';
                div.style.background = `linear-gradient(to bottom, ${preset.color1}, ${preset.color2})`;
                div.onclick = () => {
                    document.getElementById('color1').value = preset.color1;
                    document.getElementById('color2').value = preset.color2;
                    applyGradient();
                };

                let removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.innerText = 'X';
                removeBtn.onclick = (e) => {
                    e.stopPropagation();
                    deletePreset(index);
                };
                
                div.appendChild(removeBtn);
                presetContainer.appendChild(div);
            });
        }

        function saveEditorContent() {
            localStorage.setItem('editorContent', editor.getContents());
        }

        function loadEditorContent() {
            const savedContent = localStorage.getItem('editorContent');
            if (savedContent) {
                editor.setContents(savedContent);
            }
        }

        editor.onChange = saveEditorContent;

        window.onload = function() {
            loadPresetLibrary();
            loadEditorContent();
        }
    </script>

</body>
</html>
