<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>To-Do List without Recurrence</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <div class="main-content">
    <h1>To-Do List</h1>

    <!-- Input to add a new task (No recurrence dropdown now) -->
    <div class="input-container">
      <input type="text" id="new-task" placeholder="Enter a new task"/>
      <input type="datetime-local" id="due-date-time"/>
      <select id="priority">
        <option value="low">Low Priority</option>
        <option value="medium">Medium Priority</option>
        <option value="high">High Priority</option>
      </select>
      <input type="text" id="category" placeholder="Enter category (e.g., Work, Personal)"/>
      <button id="add-button">Add Task</button>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container">
      <h3>Progress:</h3>
      <div id="progress-bar">
        <div id="progress"></div>
      </div>
    </div>

    <!-- Incomplete Tasks -->
    <h2>Tasks To Do</h2>
    <ul id="incomplete-task-list"></ul>

    <!-- Completed Tasks -->
    <h2>Completed Tasks</h2>
    <ul id="completed-task-list"></ul>

    <!-- Export and Import Buttons -->
    <div class="import-export-container">
      <button id="export-button">Download Tasks</button>
      <input type="file" id="import-file" style="display:none" accept=".csv"/>
      <label for="import-file" class="import-button">Import Tasks</label>
    </div>
  </div>

  <!-- Background Controls -->
  <div class="background-controls">
    <h2>Customize Background</h2>
    <label for="color1">Color 1:</label>
    <input type="color" id="color1" value="#ff0000"/>
    <label for="color2">Color 2:</label>
    <input type="color" id="color2" value="#0000ff"/>
    <button onclick="applyGradient()">Apply Background</button>
    <button onclick="savePreset()">Save Preset</button>
  </div>

  <!-- Preset Library -->
  <div class="preset-library">
    <h3>Preset Library</h3>
    <div id="presetContainer"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
